<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Regras do Dia</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #181c27;
    --bg3: #1f2433;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #5a5f70;
    --green: #1D9E75;
    --green-dim: rgba(29,158,117,0.15);
    --blue: #378ADD;
    --blue-dim: rgba(55,138,221,0.15);
    --red: #E24B4A;
    --red-dim: rgba(226,75,74,0.15);
    --yellow: #E2A84B;
    --yellow-dim: rgba(226,168,75,0.15);
    --purple: #9B6FE2;
    --purple-dim: rgba(155,111,226,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .container { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }

  header { margin-bottom: 28px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .week-badge {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text2);
    background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
  }

  /* Day tabs */
  .day-tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .day-tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s; background: var(--bg2);
  }
  .day-tab:hover { border-color: var(--border2); }
  .day-tab.active { background: var(--bg3); border-color: var(--green); }
  .day-tab.today .dt-label { color: var(--green); }
  .dt-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .dt-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bg3); transition: background 0.2s; }
  .day-tab.active .dt-dot { background: var(--green); }
  .dt-pct { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); }

  /* Activity cards */
  .activities-section { margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .act-card {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 8px; cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .act-card:hover { border-color: var(--border2); }
  .act-card.done { opacity: 0.6; }
  .act-card.done .act-name { text-decoration: line-through; color: var(--text3); }
  .act-check {
    width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; background: var(--bg);
  }
  .act-card.done .act-check { background: var(--green); border-color: var(--green); }
  .act-card.done .act-check::after {
    content: ''; display: block; width: 6px; height: 10px;
    border: 2px solid white; border-top: none; border-left: none;
    transform: rotate(45deg) translateY(-1px);
  }
  .act-body { flex: 1; min-width: 0; }
  .act-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; transition: all 0.15s; }
  .act-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .act-tag { font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }

  /* ── CRONÔMETRO ── */
  .timer-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px 16px;
    margin-bottom: 20px;
  }
  .timer-card.running { border-color: var(--green); }

  .timer-display {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 46px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--text);
    margin: 10px 0 18px;
    transition: color 0.3s;
  }
  .timer-card.running .timer-display { color: var(--green); }

  .timer-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .timer-btn {
    padding: 10px 0;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: var(--bg3);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .timer-btn:hover { color: var(--text); border-color: var(--text3); }
  .timer-btn.primary { background: var(--green); border-color: var(--green); color: white; }
  .timer-btn.primary:hover { opacity: 0.85; }
  .timer-btn.danger:hover { border-color: var(--red); color: var(--red); }

  /* saved hours per day */
  .timer-saved {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .timer-saved-title {
    font-size: 10px; font-weight: 500; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
  }
  .saved-bars { display: flex; flex-direction: column; gap: 7px; }
  .saved-row { display: grid; grid-template-columns: 30px 1fr 52px; gap: 10px; align-items: center; }
  .saved-lbl { font-size: 11px; font-weight: 500; color: var(--text2); text-align: right; }
  .saved-track { height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .saved-fill { height: 100%; border-radius: 99px; background: var(--blue); transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .saved-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); text-align: right; }

  .timer-total {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .timer-total-lbl { font-size: 12px; color: var(--text3); }
  .timer-total-val { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--blue); }

  /* Progress */
  .progress-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .week-track { margin-top: 12px; }
  .day-bar-row { display: grid; grid-template-columns: 30px 1fr 34px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .day-bar-row:last-child { margin-bottom: 0; }
  .dbl { font-size: 11px; font-weight: 500; color: var(--text2); text-align: right; }
  .db-track { height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .db-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .db-pct { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); text-align: right; }

  /* Summary */
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .s-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .s-num { font-size: 22px; font-weight: 600; }
  .s-lbl { font-size: 10px; color: var(--text3); margin-top: 4px; line-height: 1.4; }

  .reset-btn {
    display: block; width: 100%; background: transparent;
    border: 1px solid var(--border2); color: var(--text3);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 10px; border-radius: 10px; cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  .empty-day {
    text-align: center; padding: 32px 16px; color: var(--text3); font-size: 13px;
    background: var(--bg2); border: 1px dashed var(--border2); border-radius: 14px;
  }
  .empty-day span { display: block; font-size: 28px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div>
        <h1>Regras do Dia</h1>
        <div style="margin-top:4px;font-size:13px;color:var(--text3)">Marque as atividades concluídas</div>
      </div>
      <div class="week-badge" id="week-range"></div>
    </div>
  </header>

  <div class="day-tabs" id="day-tabs"></div>

  <div class="activities-section">
    <div class="section-label" id="day-title">Atividades</div>
    <div id="activities-list"></div>
  </div>

  <!-- CRONÔMETRO -->
  <div class="timer-card" id="timer-card">
    <div class="section-label">⏱ Cronômetro de Estudo</div>
    <div class="timer-display" id="timer-display">00:00:00</div>
    <div class="timer-btns">
      <button class="timer-btn primary" id="btn-startstop" onclick="timerStartStop()">Iniciar</button>
      <button class="timer-btn" id="btn-save" onclick="timerSave()">Salvar</button>
      <button class="timer-btn danger" onclick="timerReset()">Zerar</button>
    </div>
    <div class="timer-saved">
      <div class="timer-saved-title">Horas salvas por dia</div>
      <div class="saved-bars" id="saved-bars"></div>
      <div class="timer-total">
        <span class="timer-total-lbl">Total na semana</span>
        <span class="timer-total-val" id="timer-week-total">0h 00min</span>
      </div>
    </div>
  </div>

  <div class="progress-card">
    <div class="section-label">Progresso da semana</div>
    <div class="week-track" id="day-bars"></div>
  </div>

  <div class="summary-grid">
    <div class="s-card"><div class="s-num" id="total-done">0</div><div class="s-lbl">Feitas esta semana</div></div>
    <div class="s-card"><div class="s-num" id="best-day">—</div><div class="s-lbl">Melhor dia</div></div>
    <div class="s-card"><div class="s-num" id="overall-pct">0%</div><div class="s-lbl">Conclusão geral</div></div>
  </div>

  <button class="reset-btn" onclick="resetWeek()">Resetar semana</button>
</div>

<script>
// ── SCHEDULE ─────────────────────────────────────────────────
const schedule = {
  0: [
    { id: 's0_a', name: 'Estudar em Casa',   meta: 'Manhã · 3h',        color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's0_b', name: 'Biblioteca',        meta: '2h · Levar o PC',   color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's0_c', name: '100% Serviço',      meta: '14h – 16h',         color: 'var(--red)',    tag: 'Trabalho',  tagBg: 'var(--red-dim)',    tagColor: 'var(--red)'    },
    { id: 's0_d', name: 'Revisão do dia',    meta: 'Noite · 15min',     color: 'var(--green)',  tag: 'Hábito',    tagBg: 'var(--green-dim)', tagColor: 'var(--green)'  },
  ],
  1: [
    { id: 's1_a', name: 'Estudar em Casa',   meta: 'Manhã · 3h',        color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's1_b', name: '100% Serviço',      meta: '14h – 16h',         color: 'var(--red)',    tag: 'Trabalho',  tagBg: 'var(--red-dim)',    tagColor: 'var(--red)'    },
    { id: 's1_c', name: 'Exercício Físico',  meta: 'Tarde · 30min',     color: 'var(--yellow)', tag: 'Saúde',     tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's1_d', name: 'Leitura',           meta: 'Noite · 20min',     color: 'var(--purple)', tag: 'Hábito',    tagBg: 'var(--purple-dim)', tagColor: 'var(--purple)' },
  ],
  2: [
    { id: 's2_a', name: 'Biblioteca',        meta: 'Manhã · 2h',        color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's2_b', name: '100% Serviço',      meta: '14h – 16h',         color: 'var(--red)',    tag: 'Trabalho',  tagBg: 'var(--red-dim)',    tagColor: 'var(--red)'    },
    { id: 's2_c', name: 'Organizar Tarefas', meta: 'Tarde · 20min',     color: 'var(--yellow)', tag: 'Produtiv.', tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's2_d', name: 'Revisão do dia',    meta: 'Noite · 15min',     color: 'var(--green)',  tag: 'Hábito',    tagBg: 'var(--green-dim)', tagColor: 'var(--green)'  },
  ],
  3: [
    { id: 's3_a', name: 'Estudar em Casa',   meta: 'Manhã · 3h',        color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's3_b', name: '100% Serviço',      meta: '14h – 16h',         color: 'var(--red)',    tag: 'Trabalho',  tagBg: 'var(--red-dim)',    tagColor: 'var(--red)'    },
    { id: 's3_c', name: 'Exercício Físico',  meta: 'Tarde · 30min',     color: 'var(--yellow)', tag: 'Saúde',     tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's3_d', name: 'Leitura',           meta: 'Noite · 20min',     color: 'var(--purple)', tag: 'Hábito',    tagBg: 'var(--purple-dim)', tagColor: 'var(--purple)' },
  ],
  4: [
    { id: 's4_a', name: 'Biblioteca',        meta: 'Manhã · 2h',        color: 'var(--blue)',   tag: 'Estudo',    tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
    { id: 's4_b', name: '100% Serviço',      meta: '14h – 16h',         color: 'var(--red)',    tag: 'Trabalho',  tagBg: 'var(--red-dim)',    tagColor: 'var(--red)'    },
    { id: 's4_c', name: 'Planejar Semana',   meta: 'Tarde · 30min',     color: 'var(--yellow)', tag: 'Produtiv.', tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's4_d', name: 'Revisão semanal',   meta: 'Noite · 20min',     color: 'var(--green)',  tag: 'Hábito',    tagBg: 'var(--green-dim)', tagColor: 'var(--green)'  },
  ],
  5: [
    { id: 's5_a', name: 'Exercício Físico',  meta: 'Manhã · 1h',        color: 'var(--yellow)', tag: 'Saúde',     tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's5_b', name: 'Leitura',           meta: 'Livre · 30min',     color: 'var(--purple)', tag: 'Lazer',     tagBg: 'var(--purple-dim)', tagColor: 'var(--purple)' },
    { id: 's5_c', name: 'Projeto Pessoal',   meta: 'Tarde · 2h',        color: 'var(--blue)',   tag: 'Crescim.',  tagBg: 'var(--blue-dim)',   tagColor: 'var(--blue)'   },
  ],
  6: [
    { id: 's6_a', name: 'Descanso ativo',    meta: 'Manhã · Caminhada', color: 'var(--green)',  tag: 'Saúde',     tagBg: 'var(--green-dim)', tagColor: 'var(--green)'  },
    { id: 's6_b', name: 'Planejar semana',   meta: 'Tarde · 30min',     color: 'var(--yellow)', tag: 'Produtiv.', tagBg: 'var(--yellow-dim)', tagColor: 'var(--yellow)' },
    { id: 's6_c', name: 'Leitura',           meta: 'Noite · 30min',     color: 'var(--purple)', tag: 'Lazer',     tagBg: 'var(--purple-dim)', tagColor: 'var(--purple)' },
  ],
};

const dayNames = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const dayFull  = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const STORE_KEY   = 'regras_dia_v2';
const TIMER_KEY   = 'regras_timer_v1';

// ── STATE ─────────────────────────────────────────────────────
function getTodayIndex() { const d = new Date().getDay(); return d === 0 ? 6 : d - 1; }
function getWeekKey() {
  const now = new Date(), diff = now.getDay() === 0 ? -6 : 1 - now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() + diff);
  return mon.toISOString().slice(0,10);
}
function getTodayKey() { return new Date().toISOString().slice(0,10); }
function getWeekLabel() {
  const now = new Date(), diff = now.getDay() === 0 ? -6 : 1 - now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() + diff);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  return fmt(mon) + ' – ' + fmt(sun);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { week: getWeekKey(), checks: {} };
    const s = JSON.parse(raw);
    if (s.week !== getWeekKey()) { s.checks = {}; s.week = getWeekKey(); saveState(s); }
    return s;
  } catch { return { week: getWeekKey(), checks: {} }; }
}
function saveState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} }

// timer state: { week, days: { 'YYYY-MM-DD': seconds } }
function loadTimerState() {
  try {
    const raw = localStorage.getItem(TIMER_KEY);
    if (!raw) return { week: getWeekKey(), days: {} };
    const s = JSON.parse(raw);
    if (s.week !== getWeekKey()) { s.days = {}; s.week = getWeekKey(); saveTimerState(s); }
    return s;
  } catch { return { week: getWeekKey(), days: {} }; }
}
function saveTimerState(s) { try { localStorage.setItem(TIMER_KEY, JSON.stringify(s)); } catch {} }

let state      = loadState();
let timerState = loadTimerState();
let activeDay  = getTodayIndex();

function isChecked(id) { return !!(state.checks && state.checks[id]); }
function toggle(id) { state.checks[id] = !state.checks[id]; saveState(state); render(); }
function resetWeek() {
  if (confirm('Resetar todos os checkboxes desta semana?')) { state.checks = {}; saveState(state); render(); }
}

// ── TIMER LOGIC ───────────────────────────────────────────────
let timerRunning  = false;
let timerSeconds  = 0;   // current session seconds
let timerInterval = null;

function fmtTime(s) {
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

function fmtHM(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return `${h}h ${String(m).padStart(2,'0')}min`;
}

function timerStartStop() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('btn-startstop').textContent = 'Continuar';
    document.getElementById('btn-startstop').classList.remove('primary');
    document.getElementById('timer-card').classList.remove('running');
  } else {
    timerRunning = true;
    document.getElementById('btn-startstop').textContent = 'Pausar';
    document.getElementById('btn-startstop').classList.add('primary');
    document.getElementById('timer-card').classList.add('running');
    timerInterval = setInterval(() => {
      timerSeconds++;
      document.getElementById('timer-display').textContent = fmtTime(timerSeconds);
    }, 1000);
  }
}

function timerSave() {
  if (timerSeconds === 0) return;
  const key = getTodayKey();
  timerState.days[key] = (timerState.days[key] || 0) + timerSeconds;
  saveTimerState(timerState);
  // reset session
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  document.getElementById('timer-display').textContent = '00:00:00';
  document.getElementById('btn-startstop').textContent = 'Iniciar';
  document.getElementById('btn-startstop').classList.remove('primary');
  document.getElementById('timer-card').classList.remove('running');
  renderTimer();
  // small feedback
  const btn = document.getElementById('btn-save');
  btn.textContent = 'Salvo ✓';
  btn.style.color = 'var(--green)';
  setTimeout(() => { btn.textContent = 'Salvar'; btn.style.color = ''; }, 1500);
}

function timerReset() {
  if (!confirm('Zerar o cronômetro atual? (horas salvas não são apagadas)')) return;
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  document.getElementById('timer-display').textContent = '00:00:00';
  document.getElementById('btn-startstop').textContent = 'Iniciar';
  document.getElementById('btn-startstop').classList.remove('primary');
  document.getElementById('timer-card').classList.remove('running');
}

function renderTimer() {
  // build week date keys Mon→Sun
  const now = new Date();
  const diff = now.getDay() === 0 ? -6 : 1 - now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() + diff);
  const weekKeys = Array.from({length: 7}, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return d.toISOString().slice(0,10);
  });

  const totalWeekSec = weekKeys.reduce((s, k) => s + (timerState.days[k] || 0), 0);
  const maxDaySec = Math.max(...weekKeys.map(k => timerState.days[k] || 0), 1);

  const barsEl = document.getElementById('saved-bars');
  barsEl.innerHTML = '';
  weekKeys.forEach((k, i) => {
    const sec = timerState.days[k] || 0;
    const pct = Math.round((sec / maxDaySec) * 100);
    const row = document.createElement('div');
    row.className = 'saved-row';
    row.innerHTML = `
      <div class="saved-lbl">${dayNames[i]}</div>
      <div class="saved-track"><div class="saved-fill" style="width:${pct}%"></div></div>
      <div class="saved-time">${sec > 0 ? fmtHM(sec) : '—'}</div>
    `;
    barsEl.appendChild(row);
  });

  document.getElementById('timer-week-total').textContent = fmtHM(totalWeekSec);
}

// ── RENDER ────────────────────────────────────────────────────
function getDayProgress(di) {
  const acts = schedule[di] || [];
  if (!acts.length) return 0;
  return Math.round((acts.filter(a => isChecked(a.id)).length / acts.length) * 100);
}

function render() {
  document.getElementById('week-range').textContent = getWeekLabel();
  const todayIdx = getTodayIndex();

  // Day tabs
  const tabsEl = document.getElementById('day-tabs');
  tabsEl.innerHTML = '';
  dayNames.forEach((d, di) => {
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (di === activeDay ? ' active' : '') + (di === todayIdx ? ' today' : '');
    tab.innerHTML = `<div class="dt-label">${d}</div><div class="dt-dot"></div><div class="dt-pct">${getDayProgress(di)}%</div>`;
    tab.onclick = () => { activeDay = di; render(); };
    tabsEl.appendChild(tab);
  });

  document.getElementById('day-title').textContent = dayFull[activeDay] + (activeDay === todayIdx ? ' · Hoje' : '');

  // Activities
  const listEl = document.getElementById('activities-list');
  listEl.innerHTML = '';
  const acts = schedule[activeDay] || [];
  if (!acts.length) {
    listEl.innerHTML = '<div class="empty-day"><span>🌿</span>Sem atividades para este dia</div>';
  } else {
    acts.forEach(act => {
      const done = isChecked(act.id);
      const card = document.createElement('div');
      card.className = 'act-card' + (done ? ' done' : '');
      card.innerHTML = `
        <div class="act-check"></div>
        <div class="act-body">
          <div class="act-name" style="color:${act.color}">${act.name}</div>
          ${act.meta ? `<div class="act-meta">${act.meta}</div>` : ''}
        </div>
        <div class="act-tag" style="background:${act.tagBg};color:${act.tagColor}">${act.tag}</div>
      `;
      card.onclick = () => toggle(act.id);
      listEl.appendChild(card);
    });
  }

  // Week progress bars
  const barsEl = document.getElementById('day-bars');
  barsEl.innerHTML = '';
  let bestCount = 0, bestName = '—';
  dayNames.forEach((d, di) => {
    const a = schedule[di] || [];
    const done = a.filter(x => isChecked(x.id)).length;
    const pct = a.length ? Math.round((done / a.length) * 100) : 0;
    if (done > bestCount) { bestCount = done; bestName = d; }
    const row = document.createElement('div');
    row.className = 'day-bar-row';
    row.innerHTML = `<div class="dbl">${d}</div><div class="db-track"><div class="db-fill" style="width:${pct}%"></div></div><div class="db-pct">${pct}%</div>`;
    barsEl.appendChild(row);
  });

  // Summary
  const totalDone = Object.values(state.checks).filter(Boolean).length;
  const tp = Object.values(schedule).reduce((s, a) => s + a.length, 0);
  const overallPct = tp ? Math.round((totalDone / tp) * 100) : 0;
  document.getElementById('total-done').textContent = totalDone;
  document.getElementById('best-day').textContent = bestCount > 0 ? bestName : '—';
  document.getElementById('overall-pct').textContent = overallPct + '%';

  renderTimer();
}

render();
</script>
</body>
</html>
