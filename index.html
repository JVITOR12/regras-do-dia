<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Regras do Dia Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117; --bg2: #181c27; --bg3: #1f2433;
    --border: rgba(255,255,255,0.08); --text: #e8eaf0;
    --text2: #8b90a0; --text3: #5a5f70; --green: #1D9E75;
    --blue: #378ADD; --red: #E24B4A; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; padding: 20px; }
  .container { max-width: 480px; margin: 0 auto; }
  
  /* Cronômetro Style */
  .timer-display { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--green); background: rgba(29,158,117,0.1); padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
  .play-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; transition: 0.2s; }
  .play-btn.active { color: var(--red); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  /* New UI Elements */
  .act-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
  .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  button { padding: 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn-add { background: var(--bg3); color: var(--text); width: 100%; margin-top: 10px; border: 1px dashed var(--text3); }
  .btn-save { background: var(--green); color: white; border: none; }
  
  /* Modal de Edição */
  #edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
  .modal-content { background: var(--bg2); padding: 20px; border-radius: var(--radius); width: 90%; max-width: 400px; }
  input, select { width: 100%; padding: 10px; margin: 8px 0; background: var(--bg3); border: 1px solid var(--border); color: white; border-radius: 6px; }
</style>
</head>
<body>

<div class="container">
  <h1 id="day-title">Carregando...</h1>
  <div id="activities-list"></div>
  
  <button class="btn-add" onclick="openAddModal()">+ Adicionar Atividade</button>

  <div class="btn-group">
    <button onclick="resetWeek()">Resetar Semana</button>
    <button class="btn-save" onclick="location.reload()">Salvar e Atualizar</button>
  </div>
</div>

<div id="edit-modal">
  <div class="modal-content">
    <h2 id="modal-title">Atividade</h2>
    <input type="text" id="edit-name" placeholder="Nome da atividade">
    <input type="text" id="edit-meta" placeholder="Horário ou Detalhe">
    <select id="edit-color">
        <option value="var(--blue)">Azul (Estudo)</option>
        <option value="var(--red)">Vermelho (Trabalho)</option>
        <option value="var(--green)">Verde (Hábito)</option>
        <option value="var(--purple)">Roxo (Lazer)</option>
    </select>
    <button class="btn-save" style="width: 100%" onclick="saveActivity()">Confirmar</button>
    <button onclick="closeModal()" style="width: 100%; margin-top: 8px; background: none; color: var(--text3)">Cancelar</button>
  </div>
</div>

<script>
let schedule = JSON.parse(localStorage.getItem('my_schedule')) || {
  0: [{ id: Date.now(), name: 'Estudo Inicial', meta: '09:00', color: 'var(--blue)', seconds: 0 }],
  1: [], 2: [], 3: [], 4: [], 5: [], 6: []
};

let activeTimer = null;
let currentDay = new Date().getDay() === 0 ? 6 : new Date().getDay() - 1;

function render() {
  const list = document.getElementById('activities-list');
  list.innerHTML = '';
  document.getElementById('day-title').textContent = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'][currentDay];

  schedule[currentDay].forEach(act => {
    const card = document.createElement('div');
    card.className = 'act-card';
    card.innerHTML = `
      <div style="flex:1" onclick="editAct(${act.id})">
        <div style="color:${act.color}; font-weight:600">${act.name}</div>
        <div style="font-size:12px; color:var(--text3)">${act.meta}</div>
      </div>
      <span class="timer-display" id="t-${act.id}">${formatTime(act.seconds || 0)}</span>
      <button class="play-btn ${activeTimer === act.id ? 'active' : ''}" onclick="toggleTimer(${act.id})">
        ${activeTimer === act.id ? 'stop' : '▶'}
      </button>
    `;
    list.appendChild(card);
  });
  localStorage.setItem('my_schedule', JSON.stringify(schedule));
}

function formatTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${h}h ${m}m ${sec}s`;
}

function toggleTimer(id) {
  if (activeTimer === id) {
    clearInterval(window.interval);
    activeTimer = null;
  } else {
    clearInterval(window.interval);
    activeTimer = id;
    window.interval = setInterval(() => {
      const act = schedule[currentDay].find(a => a.id === id);
      act.seconds = (act.seconds || 0) + 1;
      document.getElementById(`t-${id}`).textContent = formatTime(act.seconds);
    }, 1000);
  }
  render();
}

// Funções de Edição
let editingId = null;
function openAddModal() {
  editingId = null;
  document.getElementById('edit-name').value = '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function saveActivity() {
  const name = document.getElementById('edit-name').value;
  const meta = document.getElementById('edit-meta').value;
  const color = document.getElementById('edit-color').value;

  if (editingId) {
    const act = schedule[currentDay].find(a => a.id === editingId);
    act.name = name; act.meta = meta; act.color = color;
  } else {
    schedule[currentDay].push({ id: Date.now(), name, meta, color, seconds: 0 });
  }
  closeModal();
  render();
}

function editAct(id) {
  const act = schedule[currentDay].find(a => a.id === id);
  editingId = id;
  document.getElementById('edit-name').value = act.name;
  document.getElementById('edit-meta').value = act.meta;
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }
function resetWeek() { if(confirm('Zerar tudo?')) { localStorage.clear(); location.reload(); } }

render();
</script>
</body>
</html>
